<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 1. BUSCADOR -->
  <div class="search-wrapper">
    <div class="search-box">
      <input id="buscarInput" type="text" placeholder="pikachu, charizard, 25…" />
      <button id="search-btn" onclick="buscarPokemon()">BUSCAR</button>
    </div>
  </div>

  <!-- 2. LOADER (oculto por defecto) -->
  <div hidden id="loader">
    <div class="pokeball">
      <div class="pokeball-line"></div>
    </div>
    <div class="loader-text">Buscando...</div>
  </div>

  <!-- 3. ERROR (oculto por defecto) -->
  <div hidden id="error-msg">
    <div class="err-title">¡No encontrado!</div>
    <p id="error-text"></p>
  </div>

  <!-- 4. TARJETA (oculta por defecto) -->
  <div hidden id="resultado">
    <h2 id="nombre"></h2>
    <img id="imagen" src="" alt="Pokemon">
    <p><strong>Tipo:</strong> <span id="tipo"></span></p>
    <p><strong>Peso:</strong> <span id="peso"></span></p>
    <p><strong>Altura:</strong> <span id="altura"></span></p>
  </div>

<script src="script.js"></script>
</body>

</html>
